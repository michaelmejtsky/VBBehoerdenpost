<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VB Behördenpost</title>

  <meta name="theme-color" content="#25346f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="VB Behördenpost">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6fa;
      color: #1e2633;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(38,54,111,.12);
    }

    .logo {
      width: 150px;
      max-width: 60%;
      margin-bottom: 20px;
      border-radius: 24px;
    }

    h1 {
      margin: 0 0 8px;
      color: #25346f;
      font-size: 30px;
    }

    .sub {
      color: #718096;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 17px 20px;
      border-radius: 14px;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg,#34499a,#25346f);
      font-weight: 700;
      font-size: 17px;
      box-shadow: 0 8px 20px rgba(37,52,111,.22);
    }

    .footer {
      margin-top: 24px;
      color: #718096;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="card">

    <img
      src="./icon-512.png"
      alt="Feuerwehr St. Pölten-Stadt"
      class="logo"
    >

    <h1>VB Behördenpost</h1>

    <div class="sub">
      Interner Zugang zur Behördenpost<br>
      Feuerwehr St. Pölten-Stadt
    </div>

    <a
      class="button"
      href="https://script.google.com/macros/s/AKfycbz5cJuK3AccClgXpPnsw1rVeJ7FX2vZ9kU2BRs06Z6x7ZM1o-xbY6FKadwlNYbkPIEI/exec"
    >
      VB Behördenpost öffnen
    </a>

    <div class="footer">
      Feuerwehr St. Pölten-Stadt
    </div>

  </div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>

</body>
</html>
