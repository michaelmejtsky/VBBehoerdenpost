<!doctype html>
<html lang="de">
<head>

  <meta name="theme-color" content="#25346f">
  <link rel="manifest" href="./manifest.json">

  <title>VB Behördenpost</title>
  <style>

  </style>
</head>
<body>
  <main class="card">
    <img src="./icon-192.png" alt="VB Behördenpost">

    <a href="https://script.google.com/macros/s/AKfycbz5cJuK3AccClgXpPnsw1rVeJ7FX2vZ9kU2BRs06Z6x7ZM1o-xbY6FKadwlNYbkPIEI/exec" id="openApp">VB Behördenpost öffnen</a>

  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
